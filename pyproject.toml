[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthtech-emergency-response"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "celery==5.3.6",
    "redis==5.0.4",
    "slowapi==0.1.9",           # rate limiting
    "python-jose[cryptography]==3.3.0",  # JWT
    "passlib[bcrypt]==1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.6",
    "pytest-mock==3.12.0",
    "pytest-cov==4.1.0",
    "httpx==0.27.0",            # async test client para FastAPI
    "pre-commit==3.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short --cov=main --cov=chat --cov=emergencies --cov=services --cov=auth --cov=schemas --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: testes que dependem de Postgres/Redis",
]

[tool.ruff]
line-length = 120
exclude = ["alembic/versions"]
